name: exact-lemma-checks

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact arithmetic checks
        run: python scripts/verify_lemmas.py
