name: exact-lemma-checks

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scoped research checks and record evidence
        run: python scripts/sponsorship_evidence.py --output research-evidence.json

      - name: Run frontier combinatorial gates
        run: |
          python scripts/bell7_gate.py
          python scripts/bell8_orbits.py
